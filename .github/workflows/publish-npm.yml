name: Publish npm

on:
  push:
    branches: ["main"]
    paths:
      - "packages/client-ts/**"
      - "scripts/npm-release*.mjs"
      - ".github/workflows/publish-npm.yml"
    tags: ["npm-v*"]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Use NPM_TOKEN to stage the first release for approval on npm"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/client-ts
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Staged bootstrap requires npm >= 11.15.0 (OIDC needs >= 11.5.1).
      # Keep the CLI independent
      # of the npm version bundled with the selected Node release.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Test release version selection
        run: node --test ../../scripts/npm-release.test.mjs
      - name: Select release version
        id: release
        env:
          AUTO_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node ../../scripts/npm-release.mjs
      - if: steps.release.outputs.publish == 'true'
        run: npm ci
      - if: steps.release.outputs.publish == 'true'
        run: go -C ../../core run ./cmd/protocolgen -check
      - if: steps.release.outputs.publish == 'true'
        run: npm run typecheck
      # These integration tests build and exercise the Go sidecar too.
      - if: steps.release.outputs.publish == 'true'
        run: npm test
      - if: steps.release.outputs.publish == 'true'
        run: npm run build
      - name: Pack the exact artifact to publish
        if: steps.release.outputs.publish == 'true'
        id: pack
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [pkg] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'npm-pack.json'), 'utf8'));
          const files = new Set(pkg.files.map(file => file.path));
          for (const file of ['dist/index.js', 'dist/index.d.ts', 'dist/node.js', 'dist/node.d.ts', 'README.md', 'LICENSE']) {
            assert.ok(files.has(file), `package is missing ${file}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${join(process.env.RUNNER_TEMP, pkg.filename)}\n`);
          NODE
      - name: Smoke test the packed package
        if: steps.release.outputs.publish == 'true'
        env:
          PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$PACKAGE_TARBALL"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHarnessKit } from '@tomanagle/harness-kit';
          import { stdio } from '@tomanagle/harness-kit/node';
          assert.equal(typeof createHarnessKit, 'function');
          assert.equal(typeof stdio, 'function');
          NODE
      - name: Save the publish artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
      - name: Publish with npm trusted publishing
        if: ${{ steps.release.outputs.publish == 'true' && !inputs.bootstrap }}
        env:
          PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance --tag "$RELEASE_TAG"
      - name: Stage the first release with NPM_TOKEN
        if: ${{ steps.release.outputs.publish == 'true' && inputs.bootstrap }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::Add the NPM_TOKEN repository secret before using bootstrap mode.'
            exit 1
          fi
          npm stage publish "$PACKAGE_TARBALL" --access public --provenance --tag "$RELEASE_TAG"
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          The first release is staged on npm and awaits maintainer approval.
          Sign in to npm as `tomanagle`, open **Staged Packages**, and approve
          the `@tomanagle/harness-kit` version shown in this run using npm's
          authentication prompt.
          The staged version is not publicly installable until approved. Use the stage
          ID or review link in this step's output; do not rerun this version.
          After approval, configure the `publish-npm.yml` trusted publisher
          with direct publishing enabled for subsequent releases.
          SUMMARY
