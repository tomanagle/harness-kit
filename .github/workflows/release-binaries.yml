name: Release binaries

on:
  push:
    tags: ["core/v*"]

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          numeric='(0|[1-9][0-9]*)'
          prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^core/v${numeric}\.${numeric}\.${numeric}(-${prerelease}(\.${prerelease})*)?$"
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo '::error::Expected a canonical Go version tag such as core/v0.1.0 or core/v0.2.0-rc.1, without build metadata.'
            exit 1
          fi
          printf 'version=%s\n' "${RELEASE_TAG#core/}" >> "$GITHUB_OUTPUT"
      - run: make lint wasm-check
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
      RELEASE_VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Build and archive
        run: |
          directory="harness-kit_${RELEASE_VERSION}_${GOOS}_${GOARCH}"
          executable=harness-kit
          if [ "$GOOS" = windows ]; then executable=harness-kit.exe; fi
          mkdir -p "dist/$directory"
          go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_VERSION" -o "dist/$directory/$executable" ./cmd/harness-kit
          cp LICENSE README.md "dist/$directory/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -r "$directory.zip" "$directory"
          else
            tar -czf "$directory.tar.gz" "$directory"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            core/dist/*.tar.gz
            core/dist/*.zip
          if-no-files-found: error

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Compute checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: |
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_VERSION" "${flags[@]}"
