name: ci
on: [push, pull_request]
jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - working-directory: core
        run: go run ./cmd/protocolgen -check
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: node --test scripts/npm-release.test.mjs
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: [core, packages/client-go]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
  portability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - working-directory: .
        run: bun install --frozen-lockfile
        env: { LEFTHOOK: "0" }
      - run: make lint wasm-check cross
  providers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [core/providers/openai, core/providers/anthropic, examples/model, examples/cli]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.*
            core/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
  typescript:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - working-directory: packages/client-ts
        run: npm install && npm run typecheck && npm test && npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HK_TEST_DATABASE_URL: postgres://postgres:test_only@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /tmp/harness-kit-server ./cmd
      - run: make security
      - run: make generate check-generated
      - run: git diff --exit-code -- . ../protocol/server-v1.schema.json ../packages/client-ts/src/remote.gen.ts ../packages/client-go/remote

  server-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start three stateless replicas and Postgres
        run: make server-cluster-up
      - name: Exercise sync, replay, auth and long polling
        run: |
          mkdir -p load-results
          set -o pipefail
          for workload in sync replay auth poll; do
            WORKLOAD="$workload" RATE=3 DURATION=10s make server-load-test 2>&1 | tee "load-results/$workload.log"
          done
      - name: Restore the disposable database to a separate copy
        run: make server-restore-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-load-results
          path: load-results
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose -f server/deploy/compose.yml logs --no-color --tail=100 server
          docker compose -f server/deploy/compose.yml down --volumes
