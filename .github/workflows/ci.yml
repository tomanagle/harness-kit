name: ci
on: [push, pull_request]
jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - working-directory: core
        run: go run ./cmd/protocolgen -check
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: [core, packages/client-go]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
  portability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - run: make lint wasm-check cross
  providers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [core/providers/openai, core/providers/anthropic, examples/model, examples/cli]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.*
            core/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
  typescript:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - working-directory: packages/client-ts
        run: npm install && npm run typecheck && npm test && npm run build
