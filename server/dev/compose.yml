services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harnesskit
      POSTGRES_USER: harness_owner
      POSTGRES_PASSWORD: harness_dev
    ports: ["127.0.0.1:${HARNESS_POSTGRES_PORT:-54329}:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness_owner -d harnesskit"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: ../.., dockerfile: server/Dockerfile }
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://harness_owner:harness_dev@postgres:5432/harnesskit?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
  server:
    build: { context: ../.., dockerfile: server/Dockerfile }
    ports: ["127.0.0.1:${HARNESS_SERVER_PORT:-8080}:8080"]
    environment:
      DATABASE_URL: postgres://harness_app:harness_dev@postgres:5432/harnesskit?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_URL: http://localhost:${HARNESS_SERVER_PORT:-8080}
      ALLOW_REGISTRATION: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  postgres:
